<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tuyển Sinh</title>
</head>

<body>
    <input id="diemChuan" type="number" placeholder="Điểm chuẩn" />
    <input id="diemMon_1" type="number" placeholder="Điểm môn thứ 1" />
    <input id="diemMon_2" type="number" placeholder="Điểm môn thứ 2" />
    <input id="diemMon_3" type="number" placeholder="Điểm môn thứ 3" />
    <label>Chọn khu vực:</label>
    <select id="khuVuc">
        <option value="0">X</option>
        <option value="2">A</option>
        <option value="1">B</option>
        <option value="0.5">C</option>
    </select>
    <label>Chọn đối tượng:</label>
    <select id="doiTuong">
        <option value="0">0</option>
        <option value="2.5">1</option>
        <option value="1.5">2</option>
        <option value="1">3</option>
    </select>
    <button id="btnKq">Kết Quả</button>
    <p id="pInfo"></p>

    <script src="./main.js"></script>
</body>

</html>
